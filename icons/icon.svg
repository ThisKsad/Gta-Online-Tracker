  <circle cx="256" cy="282" r="150" fill="none" stroke="#FF4F86" stroke-width="40" stroke-linecap="round"
          stroke-dasharray="660 943" transform="rotate(-90 256 282)"/>
  <!-- Stoppuhr-Krone -->
